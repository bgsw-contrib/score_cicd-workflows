name: Setup QEMU latest

on:
  workflow_call:
    inputs:
      qemu-version:
        description: QEMU release version to build from source (must match a https://download.qemu.org/qemu-<version>.tar.xz release)
        required: false
        default: "10.2.4"
        type: string
      qemu-targets:
        description: Comma-separated list passed to QEMU's --target-list configure option
        required: false
        default: "aarch64-softmmu"
        type: string
      install-prefix:
        description: Base directory QEMU is installed under (the resolved version is appended)
        required: false
        default: "/opt/qemu"
        type: string
      configure-args:
        description: Extra flags appended to the ./configure invocation, for consumers needing extra QEMU features
        required: false
        default: ""
        type: string
      extra-build-deps:
        description: Extra space-separated apt packages appended to the base build-dependency list
        required: false
        default: ""
        type: string
    outputs:
      install-prefix:
        description: Full path QEMU was installed under
        value: ${{ jobs.setup-qemu.outputs.install-prefix }}
      cache-key:
        description: Cache key the QEMU build was stored/restored under. Consumers MUST reuse this exact key to restore the same build in their own job.
        value: ${{ jobs.setup-qemu.outputs.cache-key }}
      bin-path:
        description: Path to the QEMU bin directory, ready to append to $GITHUB_PATH
        value: ${{ jobs.setup-qemu.outputs.bin-path }}

jobs:
  setup-qemu:
    name: Build and cache QEMU
    runs-on: ${{ vars.runner_labels_ghub_standard_x64 && fromJSON(vars.runner_labels_ghub_standard_x64) || vars.REPO_RUNNER_LABELS && fromJSON(vars.REPO_RUNNER_LABELS) || 'ubuntu-latest' }}
    outputs:
      install-prefix: ${{ steps.vars.outputs.install-prefix }}
      cache-key: ${{ steps.vars.outputs.cache-key }}
      bin-path: ${{ steps.vars.outputs.bin-path }}
    steps:
      - name: Compute cache key & paths
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          install_prefix="${{ inputs.install-prefix }}/${{ inputs.qemu-version }}"
          # Fold targets/configure-args into the key so differing builds never collide in the cache.
          config_hash="$(printf '%s' "${{ inputs.qemu-targets }}|${{ inputs.configure-args }}" | sha256sum | cut -d' ' -f1)"
          cache_key="qemu-${{ runner.os }}-${{ inputs.qemu-version }}-${config_hash}"

          echo "install-prefix=$install_prefix" >> "$GITHUB_OUTPUT"
          echo "cache-key=$cache_key" >> "$GITHUB_OUTPUT"
          echo "bin-path=$install_prefix/bin" >> "$GITHUB_OUTPUT"

          {
            echo "### QEMU setup"
            echo "- version: \`${{ inputs.qemu-version }}\`"
            echo "- targets: \`${{ inputs.qemu-targets }}\`"
            echo "- install prefix: \`$install_prefix\`"
            echo "- cache key: \`$cache_key\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore/save QEMU build cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vars.outputs.install-prefix }}
          key: ${{ steps.vars.outputs.cache-key }}

      - name: Remove apt-installed QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get remove -y --purge 'qemu-system*' 'qemu-utils' || true

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential libglib2.0-dev libpixman-1-dev \
            libfdt-dev zlib1g-dev flex bison pkg-config python3 python3-venv \
            ${{ inputs.extra-build-deps }}

      - name: Download & verify QEMU source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO "https://download.qemu.org/qemu-${{ inputs.qemu-version }}.tar.xz"
          curl -fsSLO "https://download.qemu.org/qemu-${{ inputs.qemu-version }}.tar.xz.sha512"
          sha512sum -c "qemu-${{ inputs.qemu-version }}.tar.xz.sha512"
          tar xf "qemu-${{ inputs.qemu-version }}.tar.xz"

      - name: Build & install QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: qemu-${{ inputs.qemu-version }}
        run: |
          set -euo pipefail
          ./configure \
            --prefix="${{ steps.vars.outputs.install-prefix }}" \
            --target-list="${{ inputs.qemu-targets }}" \
            --disable-docs --disable-gtk --disable-sdl \
            ${{ inputs.configure-args }}
          make -j"$(nproc)"
          make install

      - name: Validate the installation
        shell: bash
        run: "${{ steps.vars.outputs.bin-path }}/qemu-system-aarch64 -machine help"

      - name: Enable KVM group permissons
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
